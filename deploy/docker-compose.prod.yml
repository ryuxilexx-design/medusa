# Med.uz.ai production stack for one server in Uzbekistan (patient data and backups stay in the country).
#   cd deploy && cp .env.production.example .env && nano .env      # fill every value
#   docker compose -f docker-compose.prod.yml up -d --build
# Doctor dictation on this server (optional): docker compose -f docker-compose.prod.yml --profile stt up -d (docs/VOICE_SCRIBE.md)
# Then create the clinic: docker compose -f docker-compose.prod.yml exec app node database/dist/src/cli.js create-clinic --help
# Runbook: docs/DEPLOY_UZ.md
name: meduzai

# every service: rotated JSON logs (5 × 50 MB), so a chatty week never fills the disk
services:
  db:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    # parallel queries need shared memory beyond Docker's 64 MB default; tuned for a 2–4 vCPU / 8 GB database host
    shm_size: 1g
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=3GB", "-c", "work_mem=16MB", "-c", "random_page_cost=1.1", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: meduza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: meduza
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meduza -d meduza"]
      interval: 5s
      timeout: 3s
      retries: 30
    # no published port: only the app and the backup job reach the database
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: meduzai:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    depends_on:
      db: { condition: service_healthy }
    # the container probe asks the API's health route through the web proxy (see Dockerfile HEALTHCHECK)
    environment:
      APP_MODE: production
      # POSTGRES_PASSWORD goes into this address unencoded: letters and digits only (openssl rand -hex 24)
      DATABASE_URL: postgres://meduza:${POSTGRES_PASSWORD}@db:5432/meduza
      COOKIE_SECURE: "1"
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in deploy/.env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-14}
      # the address cameras and Telegram links use for this server; defaults to the HTTPS domain
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      BACKGROUND_WORKERS: ${BACKGROUND_WORKERS:-on}
      AI_MODE: ${AI_MODE:-off}
      # fiscal receipts: manual = parallel mode (cashier records the KKM receipt number); a real ОФД provider later
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-manual}
      AI_CLINICAL_ALLOWED: ${AI_CLINICAL_ALLOWED:-0}
      AI_DAILY_LIMIT_USD: ${AI_DAILY_LIMIT_USD:-5}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_PAID: ${GEMINI_PAID:-0}
      NEWS_ENABLED: ${NEWS_ENABLED:-on}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      # doctor dictation: local = the `stt` service below (audio never leaves this server); openai = cloud, needs AI_CLINICAL_ALLOWED=1
      STT_PROVIDER: ${STT_PROVIDER:-off}
      STT_BASE_URL: ${STT_BASE_URL:-}  # empty: local → http://stt:8000, openai → https://api.openai.com (config.ts)
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-large-v3}
      STT_MODEL_UZ: ${STT_MODEL_UZ:-}
      STT_MODEL_RU: ${STT_MODEL_RU:-}
      STT_API_KEY: ${STT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STT_TIMEOUT_MS: ${STT_TIMEOUT_MS:-120000}
      STT_RATE_PER_HOUR: ${STT_RATE_PER_HOUR:-30}
      API_INTERNAL_URL: http://127.0.0.1:4000
      # Caddy → Next.js → API: the client IP is two proxies away
      TRUST_PROXY_HOPS: "2"
    networks: [internal, web]

  caddy:
    # HTTPS with an automatic Let's Encrypt certificate for DOMAIN; HTTP is redirected to HTTPS
    image: caddy:2.8.4
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  stt:
    # Optional speech-to-text for doctor dictation (profile «stt»): faster-whisper behind an OpenAI-compatible
    # POST /v1/audio/transcriptions. CPU only, int8. Audio arrives from the app in memory and is not stored;
    # the models live in the stt_models volume. No published port: only the app reaches it (http://stt:8000).
    # `web` gives it internet for the one-time model download; set STT_OFFLINE=1 after the models are in place.
    profiles: ["stt"]
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: ${STT_CPU_THREADS:-4}
      STT_MODEL_TTL: "-1"
      HF_HUB_OFFLINE: ${STT_OFFLINE:-0}
      # speaches logs requests, not audio; keep its log level at info (no request bodies)
      LOG_LEVEL: info
    volumes:
      - stt_models:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        limits: { memory: "${STT_MEMORY:-6g}" }
    networks: [internal, web]

  backup:
    # daily pg_dump at BACKUP_HOUR (Tashkent time), 14 daily + 8 weekly copies, weekly restore test
    image: postgres:16.4-bookworm
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: meduza
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: meduza
      TZ: Asia/Tashkent
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      KEEP_DAILY: ${KEEP_DAILY:-14}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-8}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in deploy/.env}
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/bash", "/scripts/loop.sh"]
    networks: [internal]

volumes:
  pgdata:
  stt_models:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
